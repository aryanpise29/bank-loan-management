<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nirmala Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .topbar { background: linear-gradient(135deg, #6f42c1, #8e6dc7); padding: 12px 0; }
        .navbar-brand { color: white !important; font-weight: 600; }
        .nav-link { color: rgba(255,255,255,0.9) !important; margin: 0 10px; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: white !important; background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content { padding: 20px; }
        thead th { background: #6f42c1; color: white; font-weight: 600; }
        .table { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg topbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏦 Nirmala Bank</a>
            <div class="navbar-nav mx-auto">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/customers}">Customers</a>
                <a class="nav-link active" th:href="@{/loan-products}">Loan Products</a>
                <a class="nav-link" th:href="@{/loan-applications}">Applications</a>
                <a class="nav-link" th:href="@{/all-applications}">All Applications</a>
                <a class="nav-link" th:href="@{/reports}">Reports</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link text-white">Sign Out</button>
            </form>
        </div>
    </nav>
    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0">Loan Products</h2>
                <a th:href="@{/loan-products/new}" class="btn btn-primary">+ Add New Product</a>
            </div>
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Interest Rate (%)</th>
                            <th>Min Amount (₹)</th>
                            <th>Max Amount (₹)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.loanProductId}">1</td>
                            <td th:text="${product.productName}">Personal Loan</td>
                            <td th:text="${product.interestRate}">10.5</td>
                            <td th:text="${#numbers.formatDecimal(product.minAmount, 0, 'COMMA', 2, 'POINT')}">10,000.00</td>
                            <td th:text="${#numbers.formatDecimal(product.maxAmount, 0, 'COMMA', 2, 'POINT')}">500,000.00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="5" class="text-center py-4 text-muted">No loan products found. Click "Add New Product" to create one.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
